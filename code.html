*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel)}

header p{margin:2px 0 0;color:var(--muted);font-size:13px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

#msg{font-size:12px;color:var(--muted)}

.leaflet-container{background:var(--bg);font:inherit}
.pin{display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;font-size:12px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text)}
.leaflet-popup-content{margin:12px 14px;max-height:340px;overflow-y:auto;min-width:240px}
.card+.card{border-top:1px solid var(--border);margin-top:10px;padding-top:10px}
.card h3{margin:0 0 2px;font-size:15px}
.card .city{color:var(--muted);font-size:12px;margin-bottom:6px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;color:#fff;font-size:11px;font-weight:600;margin-bottom:6px}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12.5px}
.card dt{color:var(--muted)}
.card dd{margin:0}
.card a{color:var(--accent)}
.rem{margin-top:6px;font-size:12.5px;background:var(--hover);padding:6px 8px;border-radius:6px}
</style>

function card(a, city){
  const insta = a.insta ? (a.insta.startsWith('@')
    ? `<a href="https://instagram.com/${encodeURIComponent(a.insta.slice(1))}" target="_blank" rel="noopener">${esc(a.insta)}</a>` : esc(a.insta)) : '';
  const rows = [
    ['Affectation', esc(a.lieux.join(' · ') + ` (${a.prov}, ${a.region})`)],
    a.habite && ['Habite à', esc(a.habite)],
    a.origine && ['Vient de', esc(a.origine)],
    insta && ['Instagram', insta],
    a.tel && ['Téléphone', `<a href="tel:${a.tel.replace(/\s/g,'')}">${esc(a.tel)}</a>`],
    a.email && ['Email', `<a href="mailto:${esc(a.email)}">${esc(a.email)}</a>`],
  ].filter(Boolean);
  return `<div class="card"><h3>${esc(fullName(a))}</h3>
    <div class="city">${esc(city)}</div>
    <span class="badge" style="background:${col(a.accueil)}">Accueil : ${esc(a.accueil)}</span>
    <dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    ${a.rem?`<div class="rem">💬 ${esc(a.rem)}</div>`:''}</div>`;
}

const layer = L.layerGroup().addTo(map);
function render(){
  layer.clearLayers();
  const byCity = {};
  DATA.forEach(a => a.pts.forEach(([city,lat,lng]) => {
    (byCity[city] ||= {lat,lng,people:[]}).people.push(a);
  }));
  Object.entries(byCity).forEach(([city,g]) => {
    const best = g.people.map(p=>p.accueil).sort((x,y)=>rank(x)-rank(y))[0];
    const n = g.people.length, size = n>1 ? 26 : 18;
    const icon = L.divIcon({className:'',iconSize:[size,size],
      html:`<div class="pin" style="width:${size}px;height:${size}px;background:${col(best)}">${n>1?n:''}</div>`});
    L.marker([g.lat,g.lng],{icon,title:city}).addTo(layer)
      .bindPopup(g.people.sort((x,y)=>rank(x.accueil)-rank(y.accueil)).map(p=>card(p,city)).join(''));
  });
}
render();

// Lecture de l'Excel directement dans le navigateur (mêmes onglets et colonnes que le tableau)
function lireExcel(wb){
  const rows = name => {
    const ws = wb.Sheets[name];
    if(!ws) throw new Error(`onglet « ${name} » introuvable`);
    return XLSX.utils.sheet_to_json(ws,{header:1,defval:null}).slice(1);
  };
  const coords = {};
  rows('Lieux (carte)').forEach(r => { if(r[1] && r[4] != null) coords[String(r[1]).trim()] = [+r[4], +r[5]]; });
  const out = [], manquants = [];
  rows('Assistants').forEach(r => {
    if(!Number.isInteger(r[0])) return;
    const lieux = String(r[3]).split(';').map(l=>l.trim());
    lieux.filter(l=>!coords[l]).forEach(l=>manquants.push(l));
    const s = i => r[i] == null ? '' : String(r[i]);
    out.push({n:r[0],prenom:s(1),nom:s(2),lieux,pts:lieux.filter(l=>coords[l]).map(l=>[l,...coords[l]]),
      prov:s(4),region:s(5),habite:s(6),origine:s(7),accueil:s(8)||'Non précisé',insta:s(9),tel:s(10),email:s(11),rem:s(12)});
  });
  out.forEach(a => { if(rank(a.accueil) < 0) a.accueil = 'Non précisé'; });
  return {out, manquants};
}
document.getElementById('file').addEventListener('change', async e => {
  const f = e.target.files[0], msg = document.getElementById('msg');
  if(!f) return;
  try {
    const {out, manquants} = lireExcel(XLSX.read(await f.arrayBuffer()));
    DATA = out; render();
    msg.textContent = `${out.length} assistant·e·s chargé·e·s` +
      (manquants.length ? ` — sans coordonnées : ${[...new Set(manquants)].join(', ')}` : '');
  } catch(err) {
    msg.textContent = `Impossible de lire ce fichier (${err.message})`;
  }
  e.target.value = '';
});
</script>
